<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sabbianco Radar Ακινήτων</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: one working column — status bar, filter rail, then a dense list of listing rows (photo · facts · price · status) */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --fg:#1d2321; --muted:#5f6b67; --line:#dde2df;
  --accent:#1f5f8b; --accent-soft:#e3eef6;
  --new:#1f7a4d; --new-soft:#e2f3ea; --done:#6b5a1f; --done-soft:#f4eed8; --skip:#8a8f8d; --skip-soft:#eceeed;
  --f-display:"Fraunces",Georgia,serif; --f-body:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1c2220; --fg:#e7ecea; --muted:#9aa6a2; --line:#2c3431;
  --accent:#6fb0dc; --accent-soft:#1d3241;
  --new:#5cc792; --new-soft:#173327; --done:#d7bd6a; --done-soft:#332c16; --skip:#7d8582; --skip-soft:#242a28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1c2220; --fg:#e7ecea; --muted:#9aa6a2; --line:#2c3431;
  --accent:#6fb0dc; --accent-soft:#1d3241;
  --new:#5cc792; --new-soft:#173327; --done:#d7bd6a; --done-soft:#332c16; --skip:#7d8582; --skip-soft:#242a28; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:none;margin:0 auto;padding-inline:clamp(12px,2vw,32px);padding-block:20px 48px;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:600;font-size:1.7rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.9rem;margin:4px 0 0}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.count{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.85rem;color:var(--muted)}
.count b{color:var(--fg);font-size:1rem;margin-right:4px}
.filters{display:grid;grid-template-columns:2fr 1.3fr 1fr 1fr 1fr 1fr 1fr;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.filters label{display:grid;gap:3px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:0}
input,select{font:inherit;font-size:.92rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0;text-transform:none;letter-spacing:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tab{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tabs .spacer{flex:1}
.ms{position:relative}
.ms>button{width:100%;text-align:left;font:inherit;font-size:.95rem;text-transform:none;letter-spacing:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg,var(--surface));color:var(--fg);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms .pop{position:absolute;z-index:30;left:0;top:calc(100% + 4px);width:max(100%,280px);max-height:340px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:8px;text-transform:none;letter-spacing:0}
.ms .pop[hidden]{display:none}
.ms .pop .pa{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.ms .pop .pa button,.exp button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:3px 10px;cursor:pointer}
.ms .pop label{display:flex;flex-direction:row;gap:8px;align-items:center;font-size:.9rem;color:var(--fg);text-transform:none;letter-spacing:0;padding:3px 2px;cursor:pointer}
.ms .pop label input{width:auto}
.floorbox.off{opacity:.35;pointer-events:none}
.mode{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-weight:600;font-size:.95rem;border:0;background:transparent;color:var(--fg);padding:8px 20px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats button{font:inherit;font-size:.88rem;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer}
.cats button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.cats small{color:var(--muted);margin-left:4px}
.pw{position:relative;min-width:0}
.pick{position:absolute;left:8px;top:8px;z-index:3;display:flex;gap:6px;align-items:center;background:#000b;color:#fff;font-size:.8rem;padding:4px 9px;border-radius:6px;cursor:pointer;text-transform:none;letter-spacing:0}
.pick input{width:auto;margin:0;accent-color:var(--accent)}
.row.picked{outline:2px solid var(--accent);outline-offset:-1px}
.exp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.exp .go{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.hint{font-size:.7rem;color:var(--muted);text-transform:none;letter-spacing:0}
.check{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.check input{width:auto}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) clamp(360px,30vw,560px) minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;align-items:start}
.row.is-new{border-left:3px solid var(--new)}
.thumb{width:100%;height:340px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-content:center;text-align:center;line-height:1.05}
.thumb b{font-size:1.6rem}.thumb span{font-size:.7rem}
.thumb.has-photo{width:100%;height:340px;padding:0;overflow:hidden;position:relative;background:#ddd}
.thumb.has-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb.has-photo .sq{position:absolute;left:8px;bottom:8px;background:#000a;color:#fff;font-size:.85rem;padding:2px 8px;border-radius:5px}
.facts{min-width:0;display:flex;flex-direction:column;gap:3px;height:340px;overflow:hidden}
.loc{font-weight:600;font-size:1rem}
.loc a{color:inherit;text-decoration:none}
.loc a:hover{color:var(--accent);text-decoration:underline}
.spec{color:var(--muted);font-size:.88rem;display:flex;flex-wrap:wrap;gap:4px 12px}
.det{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px;grid-auto-rows:44px;overflow:hidden;align-content:start}
.tile{border:1px solid var(--line);border-radius:8px;padding:3px 9px;display:flex;flex-direction:column;justify-content:center;gap:0;min-width:0;overflow:hidden}
.tile.wide{grid-column:span 2}
@media (max-width:1000px){.det{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));grid-auto-rows:minmax(46px,auto)}}
.tile.full{grid-column:1/-1}
.tile span{font-size:.68rem;color:var(--muted);white-space:nowrap}
.tile b{font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.pill{font-size:.72rem;font-weight:600;letter-spacing:.03em;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.site{background:transparent;color:var(--muted);border:1px solid var(--line)}
.also{font-weight:600;color:var(--fg)}
.also a{color:var(--accent);text-decoration:none;font-weight:500}
.also a:hover{text-decoration:underline}
.pill.multi{background:var(--skip-soft);color:var(--muted)}
.side{display:flex;flex-direction:column;gap:8px;text-align:right;justify-content:space-between;height:340px;overflow:hidden}
.side>*{width:100%}
.side{max-width:420px;justify-self:end;width:100%}
.price{font-weight:700;font-size:1.4rem;white-space:nowrap}
.ppm{font-size:.8rem;color:var(--muted);white-space:nowrap}
.status{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.st{font:inherit;font-size:.78rem;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:9px 4px;cursor:pointer}
.st[aria-pressed="true"][data-s="new"]{background:var(--new-soft);color:var(--new);border-color:var(--new)}
.st[aria-pressed="true"][data-s="contacted"]{background:var(--done-soft);color:var(--done);border-color:var(--done)}
.st[aria-pressed="true"][data-s="skip"]{background:var(--skip-soft);color:var(--skip);border-color:var(--skip)}
.open{font-size:.85rem;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:8px;padding:10px;text-align:center;white-space:nowrap}
.tel{font-size:1.15rem;font-weight:700;color:#fff;background:var(--accent);text-decoration:none;border-radius:8px;padding:11px;text-align:center;white-space:nowrap}
.open:hover{background:var(--accent-soft)}
.note{font:inherit;font-size:.85rem;width:100%;padding:8px 10px;box-sizing:border-box;height:38px}
.agent{flex:1;display:grid;align-content:center;gap:4px;text-align:left;border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:0;overflow:hidden}
.ag{display:flex;justify-content:space-between;gap:8px;font-size:.78rem}
.ag span{color:var(--muted)}
.ag b{font-weight:600;text-align:right}
.ag.good b{color:#2f9e63}.ag.bad b{color:#d6604d}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted)}
.more{justify-self:center;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 16px;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.88rem}
@media (max-width:820px){.filters{grid-template-columns:1fr 1fr}.filters .wide{grid-column:1/-1}}
@media (max-width:1000px){
  .row{grid-template-columns:minmax(0,1fr)}
  .thumb,.thumb.has-photo{height:auto;aspect-ratio:16/10}
  .thumb.has-photo img{position:absolute;inset:0}
  .side{text-align:left;max-width:none;justify-self:stretch}
  .det{grid-auto-rows:auto}
  .facts,.side{height:auto;overflow:visible}
}
</style>
</head><body>

<div class="wrap">
  <header>
    <div>
      <h1>Sabbianco Radar Ακινήτων</h1>
      <p class="sub" id="sub">Ιδιώτες και μεσίτες · κατοικίες, οικόπεδα, ξενοδοχεία · μία γραμμή ανά ακίνητο</p>
    </div>
    <div class="counts" id="counts"></div>
  </header>

  <div class="mode" id="mode">
    <div class="seg" role="group" aria-label="Πωλητής"><button data-seller="owner" aria-pressed="true">Ιδιώτες</button><button data-seller="agency" aria-pressed="false">Μεσίτες</button></div>
    <div class="cats" role="group" aria-label="Κατηγορία"><button data-cat="home" aria-pressed="true">Κατοικίες<small></small></button><button data-cat="land" aria-pressed="false">Οικόπεδα<small></small></button><button data-cat="hotel" aria-pressed="false">Ξενοδοχεία<small></small></button></div>
  </div>

  <section class="filters" aria-label="Φίλτρα">
    <label class="wide" for="q">Περιοχή ή γειτονιά <span class="hint">(πολλές, χωρισμένες με κόμμα)</span>
      <input id="q" type="search" placeholder="π.χ. Γλυφάδα, Βούλα, Βάρη, Κυψέλη" autocomplete="off">
    </label>
    <div class="wide" style="display:grid;gap:3px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:0">Δήμος <span class="hint" style="display:none"></span>
      <div class="ms" id="muniBox"><button type="button" id="muniBtn">Όλη η Αττική</button>
        <div class="pop" id="muniPop" hidden><div class="pa"><button type="button" id="muniClear">Καθαρισμός</button><button type="button" id="muniClose">Κλείσιμο</button></div><div id="muniList"></div></div></div>
    </div>
    <label for="type">Τύπος
      <select id="type"><option value="">Όλοι</option></select>
    </label>
    <label for="pmin">Ελάχ. τιμή €
      <input id="pmin" type="number" inputmode="numeric" min="0" step="10000" placeholder="0">
    </label>
    <label for="pmax">Μέγ. τιμή €
      <input id="pmax" type="number" inputmode="numeric" min="0" step="10000" placeholder="χωρίς όριο">
    </label>
    <label for="smin">Ελάχ. τ.μ.
      <input id="smin" type="number" inputmode="numeric" min="0" step="5" placeholder="0">
    </label>
    <label for="smax">Μέγ. τ.μ.
      <input id="smax" type="number" inputmode="numeric" min="0" step="5" placeholder="χωρίς όριο">
    </label>
    <div class="fl floorbox" style="display:grid;gap:3px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:0">Όροφοι
      <div class="ms" id="floorBox"><button type="button" id="floorBtn">Όλοι οι όροφοι</button>
        <div class="pop" id="floorPop" hidden><div class="pa"><button type="button" id="floorClear">Καθαρισμός</button><button type="button" id="floorClose">Κλείσιμο</button></div><div id="floorList"></div></div></div>
    </div>
    <label for="src">Ιστότοπος
      <select id="src"><option value="">Όλοι οι ιστότοποι</option><option value="xe">xe.gr</option><option value="spitogatos">Spitogatos</option><option value="spiti24">Spiti24</option><option value="ktimato">Ktimatoemporiki</option><option value="gep">Greek Exclusive Properties</option><option value="realting">Realting (σε $)</option></select>
    </label>
    <label for="sort">Ταξινόμηση
      <select id="sort">
        <option value="seen">Νεότερες πρώτα</option>
        <option value="price_asc">Τιμή ↑</option>
        <option value="price_desc">Τιμή ↓</option>
        <option value="ppm_asc">€/τ.μ. ↑</option>
      </select>
    </label>
  </section>

  <div class="tabs" role="group" aria-label="Κατάσταση">
    <button class="tab" data-tab="new" aria-pressed="true">Προς έλεγχο</button>
    <button class="tab" data-tab="contacted" aria-pressed="false">Επικοινωνήσαμε</button>
    <button class="tab" data-tab="skip" aria-pressed="false">Δεν ενδιαφέρει</button>
    <button class="tab" data-tab="all" aria-pressed="false">Όλες</button>
    <span class="spacer"></span>
    <span class="exp"><span id="expCount" class="hint"></span>
      <button type="button" id="pickAll" title="Επιλογή όλων των αγγελιών που φαίνονται με τα τρέχοντα φίλτρα">Επιλογή όλων</button><button type="button" id="pickNone">Καθαρισμός επιλογής</button>
      <button type="button" class="go" id="expCopy" title="Αντιγραφή της λίστας (με τα τρέχοντα φίλτρα) για επικόλληση στο Claude">Αντιγραφή για Claude</button>
      <button type="button" class="go" id="expZip" title="ZIP με κείμενο και φωτογραφίες υψηλής ανάλυσης, για παρουσίαση">Λήψη ZIP (με φωτογραφίες)</button><button type="button" id="expCsv">CSV</button><button type="button" id="expJson">JSON</button></span>
    <label class="check" for="solo"><input id="solo" type="checkbox" checked> Μόνο ιδιώτες (απόκρυψη ομαδοποιημένων αγγελιών με μεσίτες)</label>
  </div>

  <div class="list" id="list">
    <div class="empty" id="empty">Φόρτωση αγγελιών… Οι νέες αγγελίες ιδιωτών εμφανίζονται εδώ μετά από κάθε έλεγχο.</div>
  </div>
  <button class="more" id="more" hidden>Περισσότερα</button>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const els = { list:$("#list"), empty:$("#empty"), more:$("#more"), counts:$("#counts"), sub:$("#sub"),
  q:$("#q"), type:$("#type"), pmin:$("#pmin"), pmax:$("#pmax"), smin:$("#smin"), smax:$("#smax"), src:$("#src"), sort:$("#sort"), solo:$("#solo"), toast:$("#toast") };
const SITE = { sabbianco: "Sabbianco (δικά μας)", realting: "Realting", ktimato: "Ktimatoemporiki", gep: "Greek Exclusive Properties", xe: "xe.gr", spitogatos: "Spitogatos", indomio: "Indomio", spiti24: "Spiti24", plot: "Plot" };
const srcOf = x => SITE[x.source] ? x.source : "xe";
const sitesOf = x => [SITE[srcOf(x)], ...(x.alsoOn || []).map(a => a.site)];
let counts = {};
let muniSel = new Set(), floorSel = new Set(), sellerSel = "owner", catSel = "home";
const inMode = x => (x.seller || "owner") === sellerSel && (x.category || "home") === catSel;
let picked = new Set(); try { picked = new Set(JSON.parse(localStorage.getItem('owner-listings-picked') || '[]')); } catch (e) {}
const savePicked = () => { try { localStorage.setItem('owner-listings-picked', JSON.stringify([...picked])); } catch (e) {} };
let rows = [], tab = "new", shown = 60, canWrite = true;
const PAGE = 60;
const cur = x => (x && x.currency === "USD") ? "$" : "€";
const fmt = n => n == null ? "" : n.toLocaleString("el-GR");
const muniOf = loc => (loc || "").split("(")[0].trim();
const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

function prefs(){ try{ const p = JSON.parse(localStorage.getItem("owner-listings-filters")||"{}");
  if (p.seller) sellerSel = p.seller; if (p.cat) catSel = p.cat;
  if (Array.isArray(p.floors)) floorSel = new Set(p.floors);
  if (Array.isArray(p.munis)) muniSel = new Set(p.munis);
  for (const k of ["q","type","pmin","pmax","smin","smax","src","sort"]) if (p[k]!=null) els[k].value = p[k];
  if (p.solo!=null) els.solo.checked = p.solo; if (p.tab) setTab(p.tab, true); }catch(e){} }
function savePrefs(){ try{ localStorage.setItem("owner-listings-filters", JSON.stringify({
  q:els.q.value, munis:[...muniSel], type:els.type.value, pmin:els.pmin.value, pmax:els.pmax.value, smin:els.smin.value, smax:els.smax.value, floors:[...floorSel], seller:sellerSel, cat:catSel, src:els.src.value, sort:els.sort.value, solo:els.solo.checked, tab})); }catch(e){} }

function toast(msg){ els.toast.textContent = msg; els.toast.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(()=>els.toast.hidden = true, 2200); }

function setTab(t, quiet){ tab = t; document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tab === t))); shown = PAGE; if(!quiet){ savePrefs(); render(); } }

function fillSelect(sel, values, keepFirst){
  const cur = sel.value; const first = sel.options[0].outerHTML;
  sel.innerHTML = first + values.map(v => `<option>${v.replace(/</g,"&lt;")}</option>`).join("");
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
}

// Greek floor labels -> numbers (0 ground, -1 basement, -0.5 semi-basement); a multi-floor ad lists several
function floorsOf(f){ const out = []; for (const t of String(f||"").split(",")) { const s = t.trim(); let m;
  if ((m = s.match(/^(\d+)ος/))) out.push(+m[1]);
  else if (/^(Ισόγ|ΙΣ)/.test(s)) out.push(0);
  else if (/^(Υπόγ|ΥΠ)/.test(s)) out.push(-1);
  else if (/^(Ημιυπ|ΗΜ)/.test(s)) out.push(-0.5); }
  return out; }

function filtered(){
  const qs = els.q.value.split(/[,;\n]/).map(t => norm(t.trim())).filter(Boolean), type = els.type.value;
  const pmin = +els.pmin.value || 0, pmax = +els.pmax.value || Infinity;
  const smin = +els.smin.value || 0, smax = +els.smax.value || Infinity;
  let r = rows.filter(x => inMode(x) &&
    (tab === "all" || (x.status || "new") === tab) &&
    (!els.solo.checked || !x.multi) &&
    (!qs.length || qs.some(t => norm(x.location).includes(t))) &&
    (!muniSel.size || muniSel.has(muniOf(x.location))) &&
    (!type || x.type === type) &&
    (!els.src.value || srcOf(x) === els.src.value) &&
    (x.price == null || (x.price >= pmin && x.price <= pmax)) &&
    (x.sqm == null || (x.sqm >= smin && x.sqm <= smax)) &&
    (!floorSel.size || catSel !== "home" || floorsOf(x.floor).some(n => floorSel.has(n))));
  const s = els.sort.value;
  const ppm = x => x.price && x.sqm ? x.price / x.sqm : Infinity;

    catch (e) { download(`ακίνητα-${stamp()}.md`, "text/markdown;charset=utf-8", txt); toast("Η αντιγραφή δεν επιτράπηκε — κατέβηκε αρχείο .md"); } });
  $("#expZip").addEventListener("click", async () => { const r = expRows(); if (!r.length) return toast("Δεν υπάρχουν αγγελίες για εξαγωγή");
    const btn = $("#expZip"), old = btn.textContent; btn.disabled = true; btn.textContent = "Προετοιμασία…";
    const files = r.map((x, i) => `${String(i + 1).padStart(2, "0")}-${(x.location || "akinito").replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "").slice(0, 40)}`);
    const items = r.map((x, i) => ({ id: x.id, url: x.url, source: srcOf(x), photo: x.photo || "", name: files[i] }));
    const o = r.map(expObj), h = Object.keys(o[0] || {});
    const csv = [h.join(","), ...o.map(a => h.map(k => csvCell(a[k])).join(","))].join("\r\n");
    try {
      const st = await fetch("/api/export-zip", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ md: exportMarkdown(r, files), csv, items }) });
      if (st.status === 429) throw new Error("busy"); if (!st.ok) throw new Error(st.status);
      const { job } = await st.json(); let last = null;
      for (let t = 0; t < 400; t++) { await new Promise(z => setTimeout(z, 2500));
        const s2 = await (await fetch("/api/export-zip/" + job)).json();
        if (s2.state === "error") throw new Error(s2.error);
        if (s2.state === "running") { btn.textContent = `Φωτογραφίες… ${s2.done}/${s2.total}`; continue; }
        last = s2; break; }
      if (!last) throw new Error("timeout");
      const a = document.createElement("a"); a.href = "/api/export-zip/" + job + "?download=1"; a.download = `ακίνητα-${stamp()}.zip`; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 800);
      toast(`Κατέβηκε ZIP — ${last.photos || "?"} φωτογραφίες`);
    } catch (e) { toast(String(e.message) === "busy" ? "Μια άλλη εξαγωγή τρέχει ακόμα — δοκίμασε σε λίγο." : "Η δημιουργία του ZIP απέτυχε. Δοκίμασε με λιγότερα ακίνητα."); }
    btn.disabled = false; btn.textContent = old; });
  $("#expCsv").addEventListener("click", () => { const r = expRows().map(expObj); if (!r.length) return toast("Δεν υπάρχουν αγγελίες για εξαγωγή"); const h = Object.keys(r[0]);
    download(`ακίνητα-${stamp()}.csv`, "text/csv;charset=utf-8", "\ufeff" + [h.join(","), ...r.map(o => h.map(k => csvCell(o[k])).join(","))].join("\r\n")); toast(`Κατέβηκε CSV με ${r.length} ακίνητα`); });
  $("#expJson").addEventListener("click", () => { const r = expRows().map(expObj); download(`ακίνητα-${stamp()}.json`, "application/json", JSON.stringify({ εξαγωγή: stamp(), φίλτρα: filterSummary(), σύνολο: r.length, ακίνητα: r }, null, 1)); toast(`Κατέβηκε JSON με ${r.length} ακίνητα`); });
  const orig = render; render = function(){ orig(); upd(); };
}
function setupMuni(){
  const pop = $("#muniPop");
  $("#muniBtn").addEventListener("click", () => { pop.hidden = !pop.hidden; });
  $("#muniClose").addEventListener("click", () => { pop.hidden = true; });
  $("#muniClear").addEventListener("click", () => { muniSel.clear(); pop.querySelectorAll("input").forEach(c => c.checked = false); muniLabel(); shown = PAGE; savePrefs(); render(); });
  document.addEventListener("click", e => { if (!pop.hidden && !$("#muniBox").contains(e.target)) pop.hidden = true; });
}

function boot(){
  prefs(); setupMuni(); setupFloors(); setupExport(); setupMode();
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
  ["q","type","pmin","pmax","smin","smax","src","sort","solo"].forEach(k => els[k].addEventListener("input", () => { shown = PAGE; savePrefs(); render(); }));
  els.more.addEventListener("click", () => { shown += PAGE; render(); });
}
boot();


function applyRows(list){
  rows = list;
  fillMuni([...new Set(rows.filter(inMode).map(r => muniOf(r.location)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"el")));
  fillSelect(els.type, [...new Set(rows.filter(inMode).map(r => r.type).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"el")));
  if (!rows.length) els.empty.textContent = "Δεν υπάρχουν αγγελίες ακόμα. Ο πρώτος ημερήσιος έλεγχος θα γεμίσει τη λίστα με κατοικίες ιδιωτών προς πώληση στην Αττική.";
  render();
}
async function load(){
  try {
    const a = document.activeElement;
    if (a && a.classList && a.classList.contains("note")) return;   // don't redraw while someone is typing a note
    const [l, m, cn] = await Promise.all([fetch(`/api/listings?seller=${sellerSel}&category=${catSel}`).then(r => r.json()), fetch("/api/meta").then(r => r.json()), fetch("/api/counts").then(r => r.json()).catch(() => ({}))]);
    counts = cn;
    applyRows(l);
    const run = m.run || {};
    const NAME = { xe: "xe.gr", spitogatos: "Spitogatos", indomio: "Indomio", spiti24: "Spiti24", plot: "Plot" };
    const WHY = { login: "απαιτεί σύνδεση", captcha: "μπλοκαρίστηκε από έλεγχο ρομπότ", empty: "δεν διαβάστηκαν αγγελίες", error: "ο έλεγχος απέτυχε" };
    const warn = Object.entries(m.sites || {}).filter(([, s]) => s.status && s.status !== "ok").map(([k, s]) => `${NAME[k] || k} ${WHY[s.status] || "ο έλεγχος απέτυχε"}`);
    if (run.lastCheck) {
      const t = new Date(run.lastCheck).toLocaleString("el-GR", { weekday:"short", day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit", timeZone:"Europe/Athens" });
      els.sub.textContent = `Ιδιώτες και μεσίτες · κατοικίες, οικόπεδα, ξενοδοχεία · xe.gr, Spitogatos, Spiti24 · μία γραμμή ανά ακίνητο · τελευταίος έλεγχος ${t}, ${run.lastNew ?? 0} νέες`;
      els.sub.title = warn.join(" · ");   // details only on hover, not shown in the header
    }
  } catch (e) { if (!rows.length) els.empty.textContent = "Η λίστα δεν φορτώθηκε. Ξαναφόρτωσε τη σελίδα."; }
}
load(); setInterval(load, 60000);
</script>
